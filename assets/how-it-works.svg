<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="How SearchOS routes a request: your request goes to the SKILL.md router, which loads one of nine reference files, runs the method and returns a report">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5B7BB8"/>
    </marker>
  </defs>
  <rect width="1280" height="520" rx="24" fill="#0B1120"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="640" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#F1F5FF">How a request flows</text>
    <text x="640" y="84" text-anchor="middle" font-size="16" fill="#8391AE">Only the reference file you need is loaded, so answers stay focused and context stays small.</text>

    <!-- request -->
    <g transform="translate(48 200)">
      <rect width="232" height="150" rx="16" fill="#131C33" stroke="#334155"/>
      <text x="20" y="36" font-size="13" font-weight="700" fill="#94A3B8">YOUR REQUEST</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D4EA">
        <text x="20" y="68">/searchos why did my</text>
        <text x="20" y="88">clicks drop 40%?</text>
        <text x="20" y="120" fill="#7F8DAA">+ GSC export, URL,</text>
        <text x="20" y="140" fill="#7F8DAA">  crawl, AI answers...</text>
      </g>
    </g>

    <!-- router -->
    <g transform="translate(330 215)">
      <rect width="200" height="120" rx="16" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
      <text x="100" y="46" text-anchor="middle" font-size="20" font-weight="800" fill="#F1F5FF">SKILL.md</text>
      <text x="100" y="74" text-anchor="middle" font-size="14" fill="#BFD4FF">router + workflow</text>
      <text x="100" y="96" text-anchor="middle" font-size="14" fill="#BFD4FF">+ house rules</text>
    </g>

    <!-- references -->
    <g font-size="14" font-weight="600" fill="#E2E8F7">
      <g transform="translate(590 112)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#FBBF24"/><text x="16" y="23">foundations-keywords.md</text></g>
      <g transform="translate(590 152)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#34D399"/><text x="16" y="23">content.md</text></g>
      <g transform="translate(590 192)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#F87171"/><text x="16" y="23">technical.md</text></g>
      <g transform="translate(590 232)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#34D399"/><text x="16" y="23">onpage-schema-entity.md</text></g>
      <g transform="translate(590 272)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#60A5FA"/><text x="16" y="23">offsite-authority.md</text></g>
      <g transform="translate(590 312)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#A78BFA"/><text x="16" y="23">ai-visibility.md</text></g>
      <g transform="translate(590 352)"><rect width="300" height="34" rx="10" fill="#1E1533" stroke="#F472B6" stroke-width="2"/><text x="16" y="23">measure-refresh.md</text><text x="284" y="23" text-anchor="end" fill="#F472B6">loaded</text></g>
      <g transform="translate(590 392)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#94A3B8"/><text x="16" y="23">audits.md</text></g>
      <g transform="translate(590 432)"><rect width="300" height="34" rx="10" fill="#131C33" stroke="#60A5FA"/><text x="16" y="23">local-international.md</text></g>
    </g>
    <text x="740" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">9 REFERENCE FILES</text>

    <!-- report -->
    <g transform="translate(950 170)">
      <rect width="282" height="210" rx="16" fill="#131C33" stroke="#34D399" stroke-width="2"/>
      <text x="20" y="36" font-size="13" font-weight="700" fill="#34D399">THE REPORT</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D4EA">
        <text x="20" y="70">HEADLINE</text>
        <text x="20" y="96">findings + evidence</text>
        <text x="20" y="122">DO THIS WEEK  1-3</text>
        <text x="20" y="148">NEXT CHECK    date</text>
        <text x="20" y="174">WHAT THIS DID</text>
        <text x="20" y="194">  NOT CHECK</text>
      </g>
    </g>

    <!-- arrows -->
    <g stroke="#5B7BB8" stroke-width="2.5" fill="none">
      <line x1="282" y1="275" x2="326" y2="275" marker-end="url(#a)"/>
      <path d="M532 275 C560 275 560 369 586 369" marker-end="url(#a)"/>
      <path d="M892 369 C920 369 920 275 946 275" marker-end="url(#a)"/>
    </g>
    <g transform="translate(330 380)" font-size="13" fill="#7F8DAA">
      <text x="0" y="0">+ 13 Python helper scripts</text>
      <text x="0" y="20">(audits, keyword scoring,</text>
      <text x="0" y="40">schema, AI share of voice)</text>
    </g>
  </g>
</svg>
